<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monopoly · Web Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Passion+One:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- setup / lobby -->
  <div id="setup"></div>

  <!-- main game -->
  <div id="game" style="display:none">
    <header class="topbar">
      <div class="logo">🎩 MONOPOLY <span>web edition</span></div>
      <div class="hint">Pass GO → +$200 · Buy, build, bankrupt your rivals</div>
    </header>

    <main class="board-wrap">
      <div id="board">
        <div id="center"></div>
        <div id="token-layer"></div>
      </div>
    </main>

    <aside class="sidebar">
      <section id="players" class="panel"></section>
      <section class="panel log-panel">
        <h3>📜 Activity</h3>
        <div id="log"></div>
      </section>
    </aside>
  </div>

  <!-- modal overlay -->
  <div id="modal"></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
