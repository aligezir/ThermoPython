<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مونوپولی · نسخهٔ وب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&family=Passion+One:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- صفحهٔ شروع / لابی -->
  <div id="setup"></div>

  <!-- بازی اصلی -->
  <div id="game" style="display:none">
    <header class="topbar">
      <div class="logo">🎩 مونوپولی <span>نسخهٔ وب</span></div>
      <div class="hint">عبور از «شروع» ← ۲۰۰ دلار · بخر، بساز، رقیب را ورشکست کن</div>
    </header>

    <main class="board-wrap">
      <div id="board">
        <div id="center"></div>
        <div id="token-layer"></div>
      </div>
    </main>

    <aside class="sidebar">
      <section id="players" class="panel"></section>
      <section class="panel log-panel">
        <h3>📜 رویدادها</h3>
        <div id="log"></div>
      </section>
    </aside>
  </div>

  <!-- لایهٔ مودال -->
  <div id="modal"></div>

  <!-- پشتهٔ پاپ‌آپ رویدادها (نوبت بازیکن انسانی) -->
  <div id="event-stack"></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
